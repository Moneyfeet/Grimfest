<!DOCTYPE html>
<html lang="en" data-theme="dark" style="color-scheme: dark;">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Grimfest</title>
        <link rel="stylesheet" href="lib/Styles/main.css">
        <link rel="stylesheet" href="lib/Styles/process.css">
    </head>
    <body id="body">
        <header class="header">
            <h1 id="title">Grimfest</h1>
            <nav>
                <ul class="nav-links" id="nav-links">
                    <li><a href="./index.html">Home</a></li>
                </ul>
            </nav>
        </header>
        <main class="content">
            <h1> Our Production Process</h1>
            <div class="Brief-overview">

            </div>

            <section id="roles">
                <h2>Roles</h2>
                <h3> Management</h3>
                <div class="role-cards">
                    <figure class="role">
                        <figcaption>
                            <h4>Director</h4>
                            <p>Responsible for overseeing the entire production process, making key decisions, and ensuring the project stays on track.</p>
                        </figcaption>
                    </figure>

                    <figure class="role">
                        <figcaption>
                            <h4>Producer</h4>
                            <p>Responsible for managing the production process, coordinating resources, and ensuring the project is completed on time and within budget.</p>
                        </figcaption>
                    </figure>
                    <figure class="role">
                        <figcaption>
                            <h4>Technical Director</h4>
                            <p>Responsible for overseeing the technical aspects of the production, ensuring that all equipment is functioning correctly and that the technical standards are met.</p>
                        </figcaption>
                    </figure>
                </div>

                <h3> Technical</h3>
                <div class="role-cards">
                    <figure class="role">
                        <figcaption>
                            <h4>Editor</h4>
                            <p>Responsible for editing the footage, ensuring the final product meets the desired quality standards.</p>
                        </figcaption>
                    </figure>

                    <figure class="role">
                        <figcaption>
                            <h4>Camera operator</h4>
                            <p>Responsible for operating the camera during filming, ensuring the shots are well-composed and technically sound.</p>
                        </figcaption>
                    </figure>

                    <figure class="role">
                        <figcaption>
                            <h4>Sound engineer</h4>
                            <p>Responsible for recording and mixing the audio, ensuring the sound quality is clear and balanced.</p>
                        </figcaption>
                    </figure>
                </div>
                
                <h3> Support</h3>
                <div class="role-cards">
                    <figure class="role">
                        <figcaption>
                            <h4>Makeup Artist</h4>
                            <p>Only needed for live events, they are responsible for applying makeup to actors so they look their best on camera.</p>
                        </figcaption>
                    </figure>

                    <figure class="role">
                        <figcaption>
                            <h4>Maintenance Crew</h4>
                            <p>Responsible for maintaining and repairing equipment, ensuring everything is in good working condition.</p>
                        </figcaption>
                    </figure>

                    <figure class="role">
                        <figcaption>
                            <h4>grip</h4>
                            <p>Responsible for setting up and maintaining the lighting and camera equipment, ensuring it is safe and functional.</p>
                        </figcaption>
                    </figure>
                </div>
            </section>

            <div class="eye-box">
                <div class="eye">
                    <div class="pupil"></div>
                </div>
            </div>
        </main>
        <footer class="footer">
        </footer>
        <script src="lib/Scripts/cards.js"></script>
    </body>
</html>
